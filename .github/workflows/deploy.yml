name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

# Allow the built-in token to push to the gh-pages branch
permissions:
  contents: write

# Never run two deploys at once; a newer push supersedes an in-flight one
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Recreate the gitignored .env from a single repo secret so the build
      # bakes in the Firebase config (without it, cloud sync silently turns off).
      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      # Stamp the service worker with this commit so it changes every deploy
      # and the browser always installs the fresh worker.
      - name: Stamp service worker build id
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/" public/sw.js

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
